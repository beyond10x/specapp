  - id: honesty
    block: quality
    measure: specification
    unit: count
    summary: Open `UNMAPPED:` markers in the specification sources.
    how: Occurrences of the marker `UNMAPPED:` in the files of the pack's blocks.
    direction: lower_is_better
    modes: {}
    reads: []
    status: planned

  - id: refusal_power
    block: quality
    measure: specification
    unit: share
    summary: Share of the tool's rules that have a broken example document which fails exactly that rule.
    how: Rules of the tool's check with a broken example whose check names that rule and no other, over the rules the tool reports.
    direction: higher_is_better
    modes: {}
    reads: []
    status: planned

  - id: document_health
    block: quality
    measure: specification
    unit: share
    summary: Share of the pack's example documents that are valid, with the findings per rule.
    how: Documents the tool's check calls valid, over the pack's example documents.
    direction: higher_is_better
    modes: {}
    reads: []
    status: planned

  - id: adoption_level
    block: quality
    measure: specification
    unit: level
    summary: The level of adoption the pack reaches, L0 to L5, with the metaspec features it cannot use yet as gaps.
    how: The levels of adoption of metaspec's design, read from the pack's manifest and tool; each feature the pack cannot use yet is a gap of kind `verb`.
    direction: higher_is_better
    modes: {}
    reads: []
    status: planned

  - id: drift
    block: quality
    measure: specification
    unit: count
    summary: Generated files of the pack that differ from a fresh generation.
    how: The pack's own generation check, named by an adapter verb of its manifest; a pack without the verb has the gap "drift".
    direction: lower_is_better
    modes: {}
    reads: []
    status: planned
