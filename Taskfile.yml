version: '3'

includes:
  slow:
    taskfile: ./taskfiles/slow.yml
    optional: true
  quality:
    taskfile: ./taskfiles/quality.yml
    optional: true

vars:
  SLOT:
    sh: command -v slot > /dev/null 2>&1 && echo slot || true

tasks:
  check:
    desc: Run the repository gate.
    cmds:
      - task: check:public
      - task: check:scripts
      - task: check:fixtures
      - task: check:spec
      - task: check:rust
      - task: test
      - task: check:docs
      - task: check:web
      - task: check:vocabulary

  check:public:
    desc: Refuse content that does not belong in a public repository (home paths, e-mail addresses, IP addresses, terms of the deny list METASPEC_DENYLIST names, in file contents and file names). Without METASPEC_DENYLIST (CI, a build node) the deny check is skipped.
    cmds:
      - scripts/check-public.sh

  check:scripts:
    desc: Run every script test, scripts/*.test.sh.
    cmds:
      - |
        set -eu
        n=0
        for t in scripts/*.test.sh; do
          [ -f "$t" ] || { echo "check:scripts: no scripts/*.test.sh"; exit 1; }
          echo "check:scripts: sh $t"
          sh "$t"
          n=$((n + 1))
        done
        echo "check:scripts: $n script test(s) passed"

  check:fixtures:
    desc: Validate the blocks of every fixture pack (fixtures/packs/*/blocks) with ess, and fail when a fixture pack holds anything of metaspec, a manifest above all (scripts/check-pack-dirs.sh); its manifest is fixtures/manifests/<name>.yaml.
    cmds:
      - |
        set -eu
        for blocks in fixtures/packs/*/blocks; do
          (cd "$blocks" && ess specify validate --path . --strict-requires)
        done
      - scripts/check-pack-dirs.sh

  check:spec:
    desc: Validate metaspec's own ESS specification (spec/, ess pinned by spec/ess-inputs.yaml) with --strict-requires and run its conformance suite on the interpreted reference target. The suite is synthesized once per digest of its sources under target/spec-conform/; scenarios listed in spec/known-failing.txt are known failures (scripts/check-spec-conform.sh).
    cmds:
      - scripts/check-spec-conform.sh

  check:spec:slow:
    desc: The slow lane of check:spec, not part of check. Synthesizes the suite afresh and compares its bytes with the cached suite of the same digest.
    cmds:
      - scripts/check-spec-conform.sh --slow

  check:rust:
    desc: Format and lint the Rust workspace.
    cmds:
      - cargo fmt --all --check
      - cargo clippy --locked --all-targets -- -D warnings

  test:
    desc: Run the Rust tests under cargo-nextest, among them the schema validation of the manifests (packs/, fixtures/manifests/), of the report of `metaspec pack check` and of what the adapters read from the fixture tools' own answers. A test is killed at 60 s and the step fails over 120 s (.config/nextest.toml). Prints the ten slowest tests.
    cmds:
      - cargo nextest run --workspace --locked --no-run
      - silent: true
        cmd: |
          status=0
          cargo nextest run --workspace --locked || status=$?
          echo "test: the ten slowest tests (seconds)"
          sed -n 's/.*<testcase name="\([^"]*\)" classname="\([^"]*\)".* time="\([0-9.]*\)".*/\3 \2 \1/p' \
            target/nextest/default/junit.xml | sort -rn | head -10
          exit $status

  check:vocabulary:
    desc: Fail when a block, layer, link, KPI or rule name of a fixture pack appears under crates/, web/src/ or web/*/src/ (scripts/check-vocabulary.sh). The manifests under packs/ and fixtures/manifests/ are not searched. scripts/acceptance.sh runs it with the real packs too.
    cmds:
      - cargo build --quiet --locked -p metaspec
      - scripts/check-vocabulary.sh

  check:docs:
    desc: Generate the one docs site of every fixture pack (fixtures/packs/<pack> with fixtures/manifests/<pack>.yaml) with metaspec docs build --check and compare it byte for byte with the committed fixtures/expected/site. The fixture tools are trusted in target/docs-state, apart from the user's trust.
    cmds:
      - cargo build --quiet --locked -p metaspec
      - |
        set -eu
        state=target/docs-state
        mkdir -p "$state"
        set --
        for manifest in fixtures/manifests/*.yaml; do
          pack=$(basename "$manifest" .yaml)
          XDG_STATE_HOME="$state" target/debug/metaspec trust --manifest "$manifest" --pack "fixtures/packs/$pack" > /dev/null
          set -- "$@" --pack "$manifest=fixtures/packs/$pack"
        done
        XDG_STATE_HOME="$state" target/debug/metaspec docs build "$@" --out fixtures/expected/site --check

  web:install:
    desc: Install the node packages of web/ (npm ci) when web/node_modules is missing or older than web/package-lock.json. Needs the network; check does not run it.
    cmds:
      - |
        if [ ! -d web/node_modules ] || [ web/package-lock.json -nt web/node_modules/.package-lock.json ]; then
          cd web && npm ci --no-audit --no-fund
        fi

  web:build:
    desc: Build dist/ of web/ui and web/docusaurus, which a site installs.
    cmds:
      - cd web && {{.SLOT}} npm run build --workspace ui && {{.SLOT}} npm run build --workspace docusaurus

  check:web:
    desc: Typecheck web/ui and web/docusaurus, then run the vitest suite of web/ui on the committed pages of both fixture packs (a test is killed at 60 s). Needs task web:install first.
    cmds:
      - |
        [ -d web/node_modules ] || { echo "check:web: web/node_modules is missing; run task web:install"; exit 1; }
      - cd web/ui && {{.SLOT}} npx tsc -p tsconfig.json --noEmit
      - cd web/docusaurus && {{.SLOT}} npx tsc -p tsconfig.json --noEmit
      - cd web/ui && {{.SLOT}} npx vitest run --maxWorkers=4

  ux:
    desc: The UX lane, not part of check. Builds the one docs site of both fixture packs and runs the Playwright gates on every page, light and dark, with no serious or critical axe-core violation at 1440x900 and no sideways scroll at 1440x900 and 1280x800 (scripts/ux.sh). Needs task web:install and a Chromium for Playwright.
    cmds:
      - scripts/ux.sh

  parity:
    desc: The parity of the generated agenticspec site with agenticspec's own pages, not part of check. Its manifest is packs/agenticspec.yaml, or the file given second. task parity -- <agenticspec-dir> [<manifest>]
    cmds:
      - scripts/parity.sh {{.CLI_ARGS}}

  acceptance:
    desc: The acceptance of a wave, not part of check (it needs checkouts of the real packs; their manifests are packs/orgspec.yaml, packs/agenticspec.yaml and packs/cloudspec.yaml). task acceptance -- <orgspec-dir> <agenticspec-dir> <cloudspec-dir>
    cmds:
      - scripts/acceptance.sh {{.CLI_ARGS}}
