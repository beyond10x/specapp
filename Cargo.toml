[workspace]
resolver = "3"
members = ["crates/metaspec-core", "crates/metaspec-layout", "crates/metaspec-docs", "crates/metaspec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/metaspec"
publish = false

[workspace.dependencies]
metaspec-core = { path = "crates/metaspec-core" }
metaspec-layout = { path = "crates/metaspec-layout" }
metaspec-docs = { path = "crates/metaspec-docs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
glob = "0.3"
jsonschema = { version = "0.58", default-features = false }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
