[workspace]
resolver = "3"
members = ["crates/specapp-core", "crates/specapp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/specapp"
publish = false

[workspace.dependencies]
specapp-core = { path = "crates/specapp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
glob = "0.3"
jsonschema = { version = "0.58", default-features = false }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
