format: metaspec-pack/1
pack: cloudspec
title: cloudspec
summary: Building blocks of a cloud architecture in layers, and architectures that compose them.
visibility: public
source_url: https://github.com/beyond10x/cloudspec
source_file_url: https://github.com/beyond10x/cloudspec/blob/main/{path}

blocks:
  path: blocks
  strip_prefix: cloud.

documents:
  - class: architecture
    title: Architectures
    paths: [architectures/*.yaml]
    exclude: [architectures/*.binding.yaml, architectures/*.contract.yaml]
    shape: parts-links/1
    name: architecture
    contain: { in: in, per: per }
    views:
      - id: architecture
        title: Architecture
        layout: rows
  - class: broken-architecture
    title: Broken architectures
    paths: [architectures/broken/*.yaml]
    exclude: [architectures/broken/*.contract.yaml]
    shape: parts-links/1
    name: architecture
    contain: { in: in, per: per }
    views:
      - id: architecture
        title: Architecture
        layout: rows

tool:
  run: [target/debug/cloudspec]
  verbs:
    check:
      args: [check, --json]
      exit: [0, 1]
      at: /0
      error: /error
      valid: { at: /valid }
      counts: /kpis
      findings:
        - at: /violations
          rule: "{/rule}"
          gate: { at: /gate }
          message: "{/message}"
          subject: { id: "{/subject}", link_when_contains: "->", unknown: document }
        - at: /warnings
          rule: "{/rule}"
          gate: false
          message: "{/message}"
          subject: { id: "{/subject}", link_when_contains: "->", unknown: document }
