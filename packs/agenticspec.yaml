format: metaspec-pack/1
pack: agenticspec
title: agenticspec
summary: Building blocks of agentic development, architectures that compose them, and their simulation.
visibility: public
source_url: https://github.com/beyond10x/agenticspec
source_file_url: https://github.com/beyond10x/agenticspec/blob/main/{path}

blocks:
  path: blocks
  strip_prefix: agentic.

kpis:
  path: kpis/catalogue.yaml
  fields: { measure: kind, modes: modes }

documents:
  - class: architecture
    title: Architectures
    paths: [architectures/*.yaml]
    shape: parts-links/1
    name: architecture
    contain: { per: per }
    views:
      - id: architecture
        title: Architecture
        layout: rows

tool:
  run: [target/debug/agenticspec]
  verbs:
    check:
      args: [sim, check, --json]
      exit: [0, 1]
      valid: { at: /valid }
      counts: /counts
      kpis: /kpis
      findings:
        - at: /violations
          rule: "{/rule}"
          gate: { at: /gate }
          message: "{/message}"
          subject: { id: "{/subject}", link_when_contains: "->", unknown: document }
